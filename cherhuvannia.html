<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чергування 6-Б клас</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чергування">
<meta name="theme-color" content="#1B3A5C">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231B3A5C'/%3E%3Ctext x='90' y='120' font-size='90' text-anchor='middle'%3E🧹%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#EEF3F8;--paper:#fff;--ink:#16283B;--ink-2:#5B6B7C;--line:#D3DDE8;--navy:#1B3A5C;--accent:#2E8B57;--danger:#B3402A}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:40px}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  header{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 18px;border-radius:0 0 24px 24px}
  header h1{font-size:22px;font-weight:700}
  header p{color:#B9CADB;font-size:14px;margin-top:4px}
  .tabs{display:flex;gap:6px;margin:16px 20px 10px;background:#DCE5EF;padding:4px;border-radius:12px}
  .tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--ink-2)}
  .tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(22,40,59,.12)}
  main{margin:0 20px}
  .card{background:var(--paper);border-radius:14px;padding:14px;margin-top:12px}
  .card h2{font-size:16px;font-weight:700;margin-bottom:10px}
  label.f{display:block;font-size:14px;color:var(--ink-2);margin-top:10px}
  label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
  .days{display:flex;gap:6px;margin-top:6px}
  .days button{flex:1;padding:9px 0;border-radius:9px;background:var(--bg);font-weight:600;color:var(--ink-2);border:2px solid transparent}
  .days button[aria-pressed=true]{background:#E1F2E8;border-color:var(--accent);color:#1F5E3B}
  .names{display:grid;grid-template-columns:28px 1fr 30px;gap:8px;align-items:center;margin-top:8px}
  .names span{font-size:13px;color:var(--ink-2);text-align:right}
  .names input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
  .names button{color:var(--ink-2);font-size:18px}
  .btn{width:100%;padding:14px;border-radius:12px;font-weight:700;margin-top:12px;background:var(--bg)}
  .btn.primary{background:var(--accent);color:#fff;font-size:17px}
  .btn.danger{color:var(--danger)}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:8px}
  /* schedule */
  .today{background:var(--navy);color:#fff;border-radius:14px;padding:16px;margin-top:12px}
  .today small{color:#B9CADB;font-size:14px;display:block}
  .today b{font-size:24px;line-height:1.25;display:block;margin-top:4px}
  .week{margin-top:14px}
  .week h3{font-size:14px;color:var(--ink-2);font-weight:600;padding:0 4px 6px}
  .d{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
  .d:first-child{border-top:0}
  .d.is-today{background:#E1F2E8}
  .d .dt{font-size:14px;color:var(--ink-2);line-height:1.25}
  .d .dt b{display:block;color:var(--ink);font-size:16px}
  .d .who{font-weight:600}
  .d .who i{font-style:normal;color:var(--ink-2);font-weight:400;font-size:13px;display:block}
  .cnt{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:6px 4px;font-size:15px}
  .cnt span:nth-child(even){font-weight:600;font-variant-numeric:tabular-nums}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-2)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .admin-only{display:none}
  body.admin .admin-only{display:block}
  body.admin .row.admin-only{display:flex}
  body.admin .tabs .admin-only{display:inline-block}
  dialog{border:0;border-radius:18px;padding:22px;width:min(92vw,360px);background:var(--paper);color:var(--ink)}
  dialog::backdrop{background:rgba(22,40,59,.45)}
  dialog h2{font-size:18px;font-weight:700;margin-bottom:6px}
  dialog p{color:var(--ink-2);font-size:15px;margin-bottom:14px;white-space:pre-line}
  @media print{header,.tabs,.btn{display:none}body{background:#fff}.card{padding:0}}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <h1 id="title">Чергування</h1>
    <button id="roleBtn" style="background:rgba(255,255,255,.14);color:#fff;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap"></button>
  </div>
  <p id="sub"></p>
</header>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="sched">Графік</button>
  <button role="tab" aria-selected="false" data-tab="list" class="admin-only">Учні</button>
  <button role="tab" aria-selected="false" data-tab="log">Журнал</button>
  <button role="tab" aria-selected="false" data-tab="set" class="admin-only">Налаштування</button>
</div>
<main id="view"></main>
<dialog id="ui"><h2 id="uiT"></h2><p id="uiP"></p><input id="uiI" inputmode="numeric" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:10px;font-size:20px;letter-spacing:.2em">
  <div class="dl-actions" style="display:flex;gap:8px"><button id="uiC" style="flex:1;padding:12px;border-radius:12px;background:var(--bg);font-weight:600">Скасувати</button><button id="uiOk" style="flex:1;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700">Гаразд</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY='cherhuvannia.v1';
  const $=s=>document.querySelector(s);
  // Власні вікна замість prompt/confirm/alert (вони не працюють у вбудованих переглядачах)
  const ui={
    open(t,p,{input=false,cancel=true,ok='Гаразд'}={}){return new Promise(res=>{
      const d=document.getElementById('ui');d.querySelector('#uiT').textContent=t;d.querySelector('#uiP').textContent=p||'';
      const i=d.querySelector('#uiI');i.style.display=input?'':'none';i.value='';i.type=input==='pin'?'password':'text';
      const c=d.querySelector('#uiC');c.style.display=cancel?'':'none';d.querySelector('#uiOk').textContent=ok;
      const done=v=>{d.close();d.querySelector('#uiOk').onclick=null;c.onclick=null;i.onkeydown=null;res(v)};
      d.querySelector('#uiOk').onclick=()=>done(input?i.value:true);c.onclick=()=>done(null);d.oncancel=e=>{e.preventDefault();done(null)};
      i.onkeydown=e=>{if(e.key==='Enter')done(i.value)};
      d.showModal();if(input)setTimeout(()=>i.focus(),50);
    })},
    prompt:(t,p)=>ui.open(t,p,{input:'pin'}),
    confirm:(t,p)=>ui.open(t,p,{ok:'Так'}),
    alert:(t,p)=>ui.open(t,p,{cancel:false})
  };
  // Режим перегляду за посиланням: дані вбудовані в адресу, зберігати не можна
  let shared=null;
  try{ if(location.hash.startsWith('#d=')) shared=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3))))); }catch(e){}
  let mem=null;
  const store={ load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return mem}}, save(d){if(shared)return;mem=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}} };
  const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
  const addDays=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

  let data=shared||store.load()||{
    className:'6-Б клас', perDay:4, days:[1,2,3,4,5],
    start:todayISO(), end:addDays(todayISO(),270),
    skip:'', // дати, які пропускаємо (канікули), через кому
    absences:[], // {name, from, to}
    names:Array.from({length:21},(_,i)=>'Учень '+(i+1))
  };
  data.absences ||= []; data.log ||= []; data.events ||= []; data.trash ||= [];
  const logEvent=t=>{data.events.unshift({ts:new Date().toLocaleString('uk-UA'),t});data.events=data.events.slice(0,300);};
  // ---- Ролі: адміністратор (вчитель) з PIN-кодом і користувач (тільки перегляд)
  const hash=str=>{let h=5381;for(const c of str+'|6b')h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
  let admin=false;
  function setAdmin(v){admin=v&&!shared;document.body.classList.toggle('admin',admin);
    if(!admin&&(tab==='list'||tab==='set')){tab='sched';}
    document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===tab));
    $('#roleBtn').textContent=shared?'Перегляд':admin?'Адміністратор · вийти':'Увійти (PIN)';
    render();}
  $('#roleBtn').onclick=async()=>{
    if(shared){toast('Це посилання лише для перегляду');return;}
    if(admin){setAdmin(false);data.adminDevice=false;store.save(data);toast('Режим перегляду');return;}
    const p=await ui.prompt('Вхід адміністратора','Введіть PIN-код');if(p==null)return;
    if(hash(p)===data.pin){data.adminDevice=true;store.save(data);setAdmin(true);toast('Ви адміністратор');}else{logEvent('Невдала спроба входу');store.save(data);toast('Невірний PIN');}
  };
  // Хто відкрив програму першим на цьому пристрої — той адміністратор
  async function firstRun(){
    if(shared||data.pin)return;
    let a='';
    while(!/^\d{4,8}$/.test(a)){
      a=await ui.prompt('Ви перший — ви адміністратор','Придумайте PIN-код з 4–8 цифр, щоб ніхто інший не міг змінювати графік');
      if(a==null){a='0000';break;}
    }
    data.pin=hash(a);data.adminDevice=true;logEvent('Перший запуск: створено адміністратора');store.save(data);
    if(a==='0000')await ui.alert('Встановлено PIN 0000','Змініть його в «Налаштуваннях».');
  }
  let tab='sched';
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let tT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1600)};
  const DAY=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
  const fmtD=iso=>new Date(iso+'T12:00').toLocaleDateString('uk-UA',{day:'numeric',month:'short'});

  // ---- Головне: побудова графіка без повторів
  // Проходимо список по колу. Поки коло не завершене — ніхто не чергує вдруге.
  // Після кожного повного кола список зсувається на 1, тому пари/трійки теж не повторюються.
  function buildSchedule(){
    const names=data.names.map(n=>n.trim()).filter(Boolean);
    const n=names.length; if(!n) return [];
    const skip=new Set(data.skip.split(/[,\s]+/).filter(Boolean));
    const isAbsent=(name,d)=>data.absences.some(a=>a.name===name&&d>=a.from&&(!a.to||d<=a.to));
    const out=[]; let queue=[], cycle=0;
    const refill=()=>{ // нове коло: порядок зсунуто на номер кола, щоб групи не повторювались
      for(let i=0;i<n;i++) queue.push(names[(i+cycle)%n]);
      cycle=(cycle+1)%n;
    };
    for(let d=data.start; d<=data.end; d=addDays(d,1)){
      const wd=new Date(d+'T12:00').getDay();
      if(!data.days.includes(wd)||skip.has(d)) continue;
      const who=[], absent=[];
      let guard=0;
      while(who.length<data.perDay && guard<2){
        if(!queue.length){refill();guard++;}
        const idx=queue.findIndex(nm=>!isAbsent(nm,d)&&!who.includes(nm));
        if(idx===-1){ if(queue.length>=n) break; refill(); guard++; continue; }
        who.push(queue[idx]); queue.splice(idx,1);
      }
      names.forEach(nm=>{ if(isAbsent(nm,d)) absent.push(nm); });
      out.push({date:d,who,absent,cycle});
    }
    return out;
  }

  // ---- Журнал: минулі дні фіксуються назавжди і не змінюються при редагуванні списку
  function freezeLog(){
    const t=todayISO(), have=new Set(data.log.map(x=>x.date));
    let added=0;
    buildSchedule().forEach(x=>{ if(x.date<t && !have.has(x.date)){ data.log.push({date:x.date,who:x.who,absent:x.absent}); added++; } });
    if(added){ data.log.sort((a,b)=>a.date.localeCompare(b.date)); store.save(data); }
  }
  const withLog=s=>{ const m=new Map(data.log.map(x=>[x.date,x])); return s.map(x=>m.has(x.date)?{...x,...m.get(x.date),fixed:true}:x); };

  // ---- Рендер
  function renderSched(){
    const s=withLog(buildSchedule()), t=todayISO();
    if(!s.length){$('#view').innerHTML='<div class="card empty">Перевірте дати й дні тижня в налаштуваннях.</div>';return;}
    const next=s.find(x=>x.date>=t);
    const count={}; s.forEach(x=>x.who.forEach(w=>count[w]=(count[w]||0)+1));
    // групуємо по тижнях
    const weeks={}; s.forEach(x=>{const d=new Date(x.date+'T12:00');const mon=addDays(x.date,-(d.getDay()+6)%7);(weeks[mon]||=[]).push(x)});
    $('#view').innerHTML=`
      ${next?`<div class="today"><small>${next.date===t?'Сьогодні чергують':'Наступне чергування, '+fmtD(next.date)}</small><b>${next.who.map(esc).join(' та ')}</b></div>`:''}
      <div class="card">
        <label class="f admin-only" style="margin-top:0">Чергових на день<select id="perQuick">${[1,2,3,4,5,6].map(v=>`<option ${v===data.perDay?'selected':''}>${v}</option>`).join('')}</select></label>
        <div class="row"><button class="btn" id="printBtn">Роздрукувати</button><button class="btn" id="csvBtn">Зберегти CSV</button></div>
        <button class="btn admin-only" id="shareBtn">Поділитися графіком з батьками та учнями</button>
      </div>
      ${Object.keys(weeks).map(m=>`<section class="week"><h3>Тиждень від ${fmtD(m)}</h3><div class="card" style="padding:0;margin:0">
        ${weeks[m].map(x=>`<div class="d ${x.date===t?'is-today':''}"><div class="dt">${DAY[new Date(x.date+'T12:00').getDay()]}<b>${fmtD(x.date)}</b></div>
          <div class="who">${x.who.map(esc).join(', ')||'—'}<i>${x.who.length<data.perDay?'не вистачає чергових · ':''}${x.absent.length?'відсутні: '+x.absent.map(esc).join(', '):(x.fixed?'записано в журнал':'коло '+(x.cycle+1))}</i></div></div>`).join('')}
      </div></section>`).join('')}
      <div class="card"><h2>Скільки разів чергує кожен</h2><div class="cnt">${data.names.filter(n=>n.trim()).map(n=>`<span>${esc(n)}</span><span>${count[n.trim()]||0}</span>`).join('')}</div></div>`;
    $('#perQuick').onchange=e=>{data.perDay=+e.target.value;store.save(data);render();toast('Тепер по '+data.perDay+' на день');};
    $('#printBtn').onclick=()=>window.print();
    $('#shareBtn').onclick=()=>{
      const pub={className:data.className,perDay:data.perDay,days:data.days,start:data.start,end:data.end,skip:data.skip,names:data.names,absences:data.absences,log:data.log,events:[],trash:[]};
      const url=location.origin+location.pathname+'#d='+btoa(unescape(encodeURIComponent(JSON.stringify(pub))));
      if(navigator.share){navigator.share({title:'Графік чергування '+data.className,url}).catch(()=>{});}
      else{navigator.clipboard?.writeText(url);toast('Посилання скопійовано');}
      logEvent('Створено посилання для перегляду');store.save(data);
    };
    $('#csvBtn').onclick=()=>{
      const csv='\uFEFFДата;Чергові\n'+s.map(x=>x.date+';'+x.who.join(', ')).join('\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cherhuvannia.csv';a.click();
    };
  }

  function renderList(){
    $('#view').innerHTML=`<div class="card"><h2>Список класу (${data.names.length})</h2>
      <div id="names">${data.names.map((n,i)=>`<div class="names"><span>${i+1}</span><input data-i="${i}" value="${esc(n)}" placeholder="Прізвище Ім’я"><button data-del="${i}" aria-label="Видалити">✕</button></div>`).join('')}</div>
      <button class="btn" id="addName">+ Додати учня</button>
      <button class="btn" id="shuffle">Перемішати порядок</button>
      <button class="btn" id="sort">Сортувати за алфавітом</button></div>
      <div class="card"><h2>Відсутність</h2>
      <p style="font-size:14px;color:var(--ink-2)">Відсутній учень пропускає чергування, а його місце займає наступний за списком. Якщо його черга припала на дні відсутності — він чергує першого ж дня, коли повертається до школи. Дату «по» можна не вказувати: тоді натисніть «Повернувся», коли учень прийде.</p>
      <label class="f">Учень<select id="abName">${data.names.filter(n=>n.trim()).map(n=>`<option>${esc(n.trim())}</option>`).join('')}</select></label>
      <div class="row"><label class="f" style="flex:1">З<input id="abFrom" type="date" value="${todayISO()}"></label><label class="f" style="flex:1">По (можна залишити порожнім)<input id="abTo" type="date" value=""></label></div>
      <button class="btn primary" id="abAdd">Позначити відсутнім</button>
      <div style="margin-top:10px">${data.absences.map((a,i)=>`<div class="d"><div class="dt">${fmtD(a.from)}${!a.to?' – …':a.to!==a.from?' – '+fmtD(a.to):''}</div><div class="who">${esc(a.name)} <button data-ab="${i}" aria-label="Прибрати" style="color:var(--ink-2);float:right">✕</button>${!a.to||a.to>=todayISO()?`<button data-back="${i}" style="color:var(--accent);float:right;font-weight:600;margin-right:10px">Повернувся</button>`:''}</div></div>`).join('')||'<div class="empty" style="padding:10px">Відсутніх немає</div>'}</div></div>`;
    $('#abAdd').onclick=()=>{const name=$('#abName').value,from=$('#abFrom').value,to=$('#abTo').value;
      if(!name||!from){toast('Оберіть учня й дату');return;}
      data.absences.push({name,from,to:to&&to<from?from:to});logEvent('Відсутність: '+name+' з '+from+(to?' по '+to:''));store.save(data);renderList();toast(name+' — відсутній');};
    $('#view').addEventListener('click',e=>{
      const bk=e.target.closest('[data-back]');
      if(bk){const a=data.absences[+bk.dataset.back];const y=addDays(todayISO(),-1);if(y<a.from){data.absences.splice(+bk.dataset.back,1);}else a.to=y;logEvent('Повернувся: '+a.name);store.save(data);renderList();toast(a.name+' сьогодні знову в черзі');return;}
      const b=e.target.closest('[data-ab]');if(!b)return;data.absences.splice(+b.dataset.ab,1);store.save(data);renderList();});
    $('#names').addEventListener('input',e=>{if(e.target.dataset.i!=null){data.names[+e.target.dataset.i]=e.target.value;store.save(data);}});
    $('#names').addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b)return;const nm=data.names[+b.dataset.del];if(!await ui.confirm('Видалити «'+nm+'»?','Історія чергувань збережеться в журналі.'))return;
      data.names.splice(+b.dataset.del,1);if(nm.trim())data.trash.unshift(nm);logEvent('Видалено учня: '+nm);store.save(data);renderList();});
    $('#addName').onclick=()=>{data.names.push('');store.save(data);renderList();setTimeout(()=>{const ins=document.querySelectorAll('#names input');ins[ins.length-1].focus()},0);};
    $('#shuffle').onclick=()=>{for(let i=data.names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[data.names[i],data.names[j]]=[data.names[j],data.names[i]];}store.save(data);renderList();toast('Порядок перемішано');};
    $('#sort').onclick=()=>{data.names.sort((a,b)=>a.localeCompare(b,'uk'));store.save(data);renderList();};
  }

  function renderSet(){
    $('#view').innerHTML=`<div class="card"><h2>Параметри чергування</h2>
      <label class="f">Назва класу<input id="cls" value="${esc(data.className)}"></label>
      <label class="f">Скільки чергових на день<select id="per">${[1,2,3,4,5,6].map(v=>`<option ${v===data.perDay?'selected':''}>${v}</option>`).join('')}</select></label>
      <label class="f">Дні чергування</label>
      <div class="days">${[1,2,3,4,5,6].map(d=>`<button data-d="${d}" aria-pressed="${data.days.includes(d)}">${DAY[d]}</button>`).join('')}</div>
      <label class="f">Початок<input id="start" type="date" value="${data.start}"></label>
      <label class="f">Кінець<input id="end" type="date" value="${data.end}"></label>
      <label class="f">Пропустити дати (канікули, свята) — через кому, у форматі 2026-10-27<input id="skip" value="${esc(data.skip)}" placeholder="2026-10-27, 2026-10-28"></label>
      <button class="btn" id="pinBtn">Змінити PIN-код адміністратора</button>
      <button class="btn danger" id="reset">Скинути всі налаштування</button></div>`;
    $('#pinBtn').onclick=async()=>{const a=await ui.prompt('Новий PIN-код','Від 4 до 8 цифр');if(!a)return;if(!/^\d{4,8}$/.test(a)){toast('PIN — від 4 до 8 цифр');return;}data.pin=hash(a);logEvent('Змінено PIN адміністратора');store.save(data);toast('PIN змінено');};
    const bind=(id,key,f=v=>v)=>$('#'+id).addEventListener('input',e=>{data[key]=f(e.target.value);store.save(data);renderHeader();});
    bind('cls','className');bind('per','perDay',Number);bind('start','start');bind('end','end');bind('skip','skip');
    document.querySelector('.days').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=+b.dataset.d;data.days=data.days.includes(d)?data.days.filter(x=>x!==d):[...data.days,d].sort();store.save(data);renderSet();});
    $('#reset').onclick=async()=>{if(!await ui.confirm('Скинути налаштування?','Список і параметри буде скинуто. Журнал чергувань залишиться.'))return;
      const keep={log:data.log,events:data.events,trash:data.trash,pin:data.pin,adminDevice:true};
      data={className:'6-Б клас',perDay:4,days:[1,2,3,4,5],start:todayISO(),end:addDays(todayISO(),270),skip:'',absences:[],names:Array.from({length:21},(_,i)=>'Учень '+(i+1)),...keep};
      logEvent('Скинуто налаштування');store.save(data);render();toast('Налаштування скинуто');};
  }

  function renderLog(){
    const q=(window._logQ||'').toLowerCase();
    const rows=[...data.log].reverse().filter(x=>!q||x.who.some(w=>w.toLowerCase().includes(q)));
    const count={}; data.log.forEach(x=>x.who.forEach(w=>count[w]=(count[w]||0)+1));
    $('#view').innerHTML=`<div class="card"><h2>Хто вже чергував</h2>
      <p style="font-size:14px;color:var(--ink-2)">Кожен минулий день записується сюди автоматично і більше не змінюється — навіть якщо учня видалити зі списку чи змінити налаштування.</p>
      <label class="f">Пошук за прізвищем<input id="logQ" value="${esc(window._logQ||'')}" placeholder="Почніть вводити"></label>
      <div class="row admin-only"><button class="btn" id="bkBtn">Зберегти резервну копію</button><button class="btn" id="rsBtn">Відновити з копії</button></div>
      <input type="file" id="bkFile" accept="application/json" hidden></div>
      <div class="card" style="padding:0">${rows.map(x=>`<div class="d"><div class="dt">${DAY[new Date(x.date+'T12:00').getDay()]}<b>${fmtD(x.date)}</b></div>
        <div class="who">${x.who.map(esc).join(', ')||'—'}${x.absent&&x.absent.length?`<i>відсутні: ${x.absent.map(esc).join(', ')}</i>`:''}</div></div>`).join('')||'<div class="empty">Записів ще немає — вони з’являться після першого дня чергування.</div>'}</div>
      ${Object.keys(count).length?`<div class="card"><h2>Разів чергував (за журналом)</h2><div class="cnt">${Object.entries(count).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<span>${esc(n)}</span><span>${c}</span>`).join('')}</div></div>`:''}
      ${data.trash.length?`<div class="card"><h2>Видалені учні</h2>${data.trash.map((n,i)=>`<div class="d"><div class="dt">${count[n]||0} черг.</div><div class="who">${esc(n)} ${admin?`<button data-restore="${i}" style="color:var(--accent);float:right;font-weight:600">Повернути</button>`:''}</div></div>`).join('')}</div>`:''}
      <div class="card admin-only"><h2>Історія змін</h2>${data.events.slice(0,50).map(e=>`<div class="d"><div class="dt" style="font-size:12px">${e.ts}</div><div class="who" style="font-weight:400">${esc(e.t)}</div></div>`).join('')||'<div class="empty" style="padding:10px">Змін не було</div>'}</div>`;
    $('#logQ').oninput=e=>{window._logQ=e.target.value;renderLog();$('#logQ').focus();$('#logQ').setSelectionRange(99,99);};
    $('#bkBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='cherhuvannia-'+todayISO()+'.json';a.click();logEvent('Збережено резервну копію');store.save(data);};
    $('#rsBtn').onclick=()=>$('#bkFile').click();
    $('#bkFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d.names))throw 0;
      const dates=new Set(data.log.map(x=>x.date));(d.log||[]).forEach(x=>{if(!dates.has(x.date))data.log.push(x)});data.log.sort((a,b)=>a.date.localeCompare(b.date));
      Object.assign(data,{names:d.names,perDay:d.perDay||data.perDay,days:d.days||data.days,start:d.start||data.start,end:d.end||data.end,skip:d.skip||'',absences:d.absences||[],className:d.className||data.className});
      logEvent('Відновлено з резервної копії');store.save(data);render();toast('Копію відновлено');}).catch(()=>toast('Файл не розпізнано'));e.target.value='';};
    $('#view').addEventListener('click',e=>{const b=e.target.closest('[data-restore]');if(!b)return;const nm=data.trash.splice(+b.dataset.restore,1)[0];data.names.push(nm);logEvent('Повернуто учня: '+nm);store.save(data);renderLog();toast(nm+' повернуто до списку');});
  }

  function renderHeader(){
    $('#title').textContent='Чергування · '+data.className;
    $('#sub').textContent=`${data.names.filter(n=>n.trim()).length} учнів · по ${data.perDay} на день · без повторів, доки не пройде все коло`;
  }
  function render(){renderHeader();freezeLog();if(!admin&&(tab==='list'||tab==='set'))tab='sched';({sched:renderSched,list:renderList,log:renderLog,set:renderSet})[tab]();}
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));render();});

  const manifest={name:'Чергування',short_name:'Чергування',start_url:location.href,display:'standalone',background_color:'#EEF3F8',theme_color:'#1B3A5C',lang:'uk',
    icons:[{src:document.querySelector('link[rel=apple-touch-icon]').href,sizes:'180x180',type:'image/svg+xml'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.appendChild(l);
  setAdmin(!!data.adminDevice);
  firstRun().then(()=>setAdmin(!!data.adminDevice));
})();
</script>
</body>
</html>
